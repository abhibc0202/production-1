apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: production-1-hpa
  namespace: production-1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: production-1
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
