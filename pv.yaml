apiVersion: v1
kind: PersistentVolume
metadata:
  name: production-1-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - devops-cluster-worker
  hostPath:
    path: /opt/production-1-data
    type: Directory
